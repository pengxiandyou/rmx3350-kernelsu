name: Build RMX3350 KernelSU Kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone Realme AndroidT kernel source (4.19.191)
        run: |
          git clone --depth 1 \
            https://github.com/realme-kernel-opensource/realme_X7max_GTneo_GTneo2T-AndroidT-kernel-source.git \
            kernel
          echo "--- kernel version ---"
          head -6 kernel/Makefile

      - name: Clone Realme AndroidT vendor source
        run: |
          git clone --depth 1 \
            https://github.com/realme-kernel-opensource/realme_X7max_GTneo_GTneo2T-AndroidT-vendor-source.git \
            vendor_repo
          mv vendor_repo/vendor ./vendor
          rm -rf vendor_repo
          # 内核构建脚本按 $(srctree)/../vendor 与 $(srctree)/../kernel-4.19 找路径
          ln -sfn "$PWD/kernel" "$PWD/kernel-4.19"
          ln -sfn "$PWD/kernel/drivers" "$PWD/drivers"
          ls -d vendor kernel-4.19 drivers

      - name: Repair dangling vendor symlinks
        run: |
          set +e
          # OPPO 源码树里 drivers/base/kernelFwUpdate 是指向 vnd/vendor/... 的软链，
          # 该布局只在 OPPO 内部构建机存在，CI 里必然断链 -> olddefconfig 报
          # drivers/base/Kconfig:155: can't open file "drivers/base/kernelFwUpdate/Kconfig"
          # 解法一：按它们期望的相对路径铺一份（../../../../vnd/vendor = 工作区的父目录）
          mkdir -p "$GITHUB_WORKSPACE/../vnd"
          ln -sfn "$GITHUB_WORKSPACE/vendor" "$GITHUB_WORKSPACE/../vnd/vendor"
          # 解法二（兜底）：直接把实体文件复制进内核树，彻底不依赖软链解析
          rm -rf kernel/drivers/base/kernelFwUpdate
          cp -r vendor/oplus/kernel/touchpanel/kernelFwUpdate kernel/drivers/base/kernelFwUpdate
          echo "--- kernelFwUpdate 内容 ---"
          ls -l kernel/drivers/base/kernelFwUpdate
          # 顺手列出全部断链，便于下一轮排查
          echo "--- 扫描内核树断链软链 ---"
          cd kernel
          broken=0
          while IFS= read -r l; do
            if [ ! -e "$l" ]; then
              echo "BROKEN: $l -> $(readlink "$l")"
              broken=$((broken+1))
            fi
          done < <(find . -type l 2>/dev/null)
          echo "broken symlink count: $broken"

      - name: Fix MTK cross-directory includes
        run: |
          # vendor 仓里的 oplus_sensor_feedback 会 include scp/rv/scp_helper.h，
          # 后者再 include scp_feature_define.h，那里写的是 #include "scp.h"。
          # driver 自己编译时靠 rv/Makefile 的 -I .../scp/include 能找到；
          # 但从 sensor 目录进来时没有那条 -I，于是：
          #   ../drivers/misc/mediatek/scp/rv/scp_feature_define.h:9:10:
          #   fatal error: scp.h file not found
          # 改成相对自身目录的路径，任何目录 include 都能解析。
          # 逐个文件修会一直漏（scp_feature_define.h 之后还有 scp_helper.h），
          # 直接对整个 scp 目录批量替换：凡是 #include "scp.h" 一律改相对路径。
          base=kernel/drivers/misc/mediatek/scp
          if [ -d "$base" ]; then
            grep -rl '^#include "scp\.h"' "$base" 2>/dev/null | while read -r f; do
              # 只有 rv/ 和 cm4/ 需要 ../include/，include/ 自己不用动
              case "$f" in
                */scp/include/*) continue ;;
              esac
              sed -i 's|^#include "scp\.h"|#include "../include/scp.h"|' "$f"
              echo "  patched: $f"
            done
            echo "--- 剩余未处理的 #include \"scp.h\" ---"
            grep -rn '^#include "scp\.h"' "$base" 2>/dev/null || echo "  (none)"
          else
            echo "::warning::$base not found, skip"
          fi

      - name: Clone KernelSU-Next into drivers/kernelsu
        run: |
          # 注意：KernelSU-Next 的仓库根不是内核模块根，真正的 Kconfig/Makefile/Kbuild
          # 在 kernel/ 子目录里。直接 clone 到 drivers/kernelsu 会导致
          #   drivers/Kconfig:241: can't open file "drivers/kernelsu/Kconfig"
          git clone --depth 1 --branch v3.4.2 \
            https://github.com/KernelSU-Next/KernelSU-Next.git ksu_src
          mkdir -p kernel/drivers/kernelsu
          cp -r ksu_src/kernel/. kernel/drivers/kernelsu/
          # uapi/ 也在仓库根，但 kernel/policy/allowlist.h 用 #include "uapi/app_profile.h"，
          # 经 Kbuild 的 -I$(KSU_KERNEL_DIR) 解析为 drivers/kernelsu/uapi/app_profile.h，
          # 所以必须一并拷进来，否则：
          #   policy/allowlist.h:6:10: fatal error: 'uapi/app_profile.h' file not found
          cp -r ksu_src/uapi kernel/drivers/kernelsu/uapi
          echo "--- drivers/kernelsu 内容 ---"
          ls -la kernel/drivers/kernelsu | head -25
          echo "--- uapi ---"
          ls -l kernel/drivers/kernelsu/uapi
          for f in Kconfig Makefile Kbuild uapi/app_profile.h uapi/supercall.h; do
            test -e "kernel/drivers/kernelsu/$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Inject KSU into Kconfig / Makefile
        run: |
          python3 scripts/inject_ksu.py kernel
          echo "--- Kconfig tail ---"
          tail -5 kernel/drivers/Kconfig
          echo "--- Makefile tail ---"
          tail -4 kernel/drivers/Makefile

      - name: Add Linux 4.19 compatibility shims
        run: |
          # KernelSU-Next 默认面向 5.10+，用到了一些 4.19 还没有的头文件。
          # 这里只加转发头，不改 KSU 源码。
          #
          #   linux/pgtable.h   5.8  才从 asm/pgtable.h 拆出
          #   linux/minmax.h    5.15 才从 linux/kernel.h 拆出
          #   linux/hex.h       5.18 才从 linux/kernel.h 拆出
          #   linux/kstrtox.h   5.11 才从 linux/kernel.h 拆出
          #   linux/unaligned.h 5.12 才从 asm/unaligned.h 拆出
          #
          # 4.19 里这些符号全都还在 linux/kernel.h / asm/unaligned.h 里，
          # 转发过去即可，语义完全一致。

          mkdir -p kernel/include/linux

          write_shim() {
            local name="$1" guard="$2" target="$3"
            printf '%s\n' \
              "#ifndef $guard" \
              "#define $guard" \
              "#include <$target>" \
              "#endif" > "kernel/include/linux/$name"
            echo "--- shim: include/linux/$name -> $target ---"
            cat "kernel/include/linux/$name"
          }

          write_shim pgtable.h   _LINUX_PGTABLE_H_COMPAT_419   asm/pgtable.h
          write_shim minmax.h    _LINUX_MINMAX_H_COMPAT_419    linux/kernel.h
          write_shim hex.h       _LINUX_HEX_H_COMPAT_419       linux/kernel.h
          write_shim kstrtox.h   _LINUX_KSTRTOX_H_COMPAT_419   linux/kernel.h
          write_shim unaligned.h _LINUX_UNALIGNED_H_COMPAT_419 asm/unaligned.h

      - name: Patch KernelSU for Linux 4.19 fops
        run: |
          # file_wrapper.c 的 struct file_operations 拷贝逻辑用到了
          # 4.19 内核里不存在的成员：
          #   fops->iopoll            5.1 引入
          #   fops->remap_file_range  4.20 引入（4.19 叫 dedupe_file_range）
          #   REMAP_FILE_DEDUP        4.20 引入
          python3 scripts/patch_ksu_419.py kernel
          echo "--- 打完补丁的关键片段 ---"
          grep -n "LINUX_VERSION_CODE\|ksu_wrapper_iopoll\|ksu_wrapper_remap_file_range" \
            kernel/drivers/kernelsu/infra/file_wrapper.c | head -30

      - name: Patch KernelSU for Linux 4.19 missing symbols
        run: |
          # 第 22 轮编译全过、ld.lld 链接 vmlinux 时报的 10 个 undefined symbol。
          # 每个符号的 4.19 等价实现见脚本头部注释。
          python3 scripts/patch_missing_symbols.py kernel/drivers/kernelsu
          echo "--- 打完补丁的关键片段 ---"
          grep -nE "kern_unmount|ksu_selinux_cred|ksu_selinux_inode|strncpy_from_unsafe|__copy_from_user_inatomic|__copy_to_user_inatomic|probe_kernel_write|sched/task.h" \
            kernel/drivers/kernelsu/feature/kernel_umount.c \
            kernel/drivers/kernelsu/selinux/selinux.c \
            kernel/drivers/kernelsu/infra/file_wrapper.c \
            kernel/drivers/kernelsu/feature/sucompat.c \
            kernel/drivers/kernelsu/runtime/ksud_integration.c \
            kernel/drivers/kernelsu/hook/arm64/patch_memory.c \
            kernel/drivers/kernelsu/policy/allowlist.c | head -40

      - name: EXPERIMENT ignore vendor .ko CRC mismatch
        run: |
          python3 scripts/patch_module_crc_test.py kernel
          echo "--- confirm ---"
          grep -n "KSU_TEST_IGNORE_CRC_419" -A4 -B2 kernel/kernel/module.c

      - name: Stub conn_dbg_add_log (OPPO private export, absent from public tree)
        run: |
          cat > kernel/kernel/conn_dbg_stub.c <<'EOF'
          // OPPO/MTK 私有日志接口，公开源码树里没有定义。
          // conninfra.ko 依赖它，缺失会导致：
          //   conninfra: Unknown symbol conn_dbg_add_log (err -2)
          //   insmod: failed to load conninfra.ko: No such file or directory
          // 这里提供一个空实现：只丢弃日志，不影响连接子系统的功能。
          #include <linux/kernel.h>
          #include <linux/export.h>

          int conn_dbg_add_log(const char *fmt, ...)
          {
          	return 0;
          }
          EXPORT_SYMBOL(conn_dbg_add_log);
          EOF
          grep -q conn_dbg_stub kernel/kernel/Makefile || echo 'obj-y += conn_dbg_stub.o' >> kernel/kernel/Makefile
          echo "--- kernel/kernel/conn_dbg_stub.c ---"
          cat kernel/kernel/conn_dbg_stub.c
          echo "--- Makefile tail ---"
          tail -3 kernel/kernel/Makefile

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev pahole zip unzip \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            python3 git make

      - name: Download AOSP Clang r416183b
        run: |
          mkdir -p "$HOME/clang"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/clang-r416183b.tar.gz"
          curl -fsSL --retry 3 --connect-timeout 40 "$URL" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          "$HOME/clang/bin/clang" --version

      - name: Merge config (stock F.28 + minimal KSU overlay)
        run: |
          cd kernel
          mkdir -p out
          ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out \
            ../configs/stock_f28.config \
            ../configs/custom_rmx3350.config
          # 确认关键项
          grep -E "^CONFIG_KSU=|^CONFIG_KSU_MANUAL_HOOK=|MODULE_SIG" out/.config | sort

      - name: Build Image.gz
        run: |
          cd kernel
          export PATH="$HOME/clang/bin:$PATH"
          # MTK/OPPO 的 sched_assist 等代码用 void foo() 旧式定义，在内核 -Werror 下直接失败：
          #   sched_assist_slide_v1.c:129: error: this old-style function definition
          #   is not preceded by a prototype [-Werror,-Wstrict-prototypes]
          #
          # 注意：必须用 -Wno-xxx（不认识的 warning 会被静默忽略），
          # 绝不能用 -Werror=xxx（不认识的选项会触发 -Wunknown-warning-option 并直接失败，
          # 例如 clang 12 不认识 GCC 的 -Werror=unused-but-set-variable）。
          KCFLAGS="-Wno-strict-prototypes -Wno-unused-but-set-variable \
                   -Wno-address-of-packed-member -Wno-incompatible-pointer-types \
                   -Wno-implicit-function-declaration -Wno-format \
                   -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast \
                   -Wno-pointer-sign -Wno-macro-redefined \
                   -Wno-parentheses-equality -Wno-unused-value \
                   -Wno-unknown-warning-option" \
          make O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            olddefconfig
          KCFLAGS="-Wno-strict-prototypes -Wno-unused-but-set-variable \
                   -Wno-address-of-packed-member -Wno-incompatible-pointer-types \
                   -Wno-implicit-function-declaration -Wno-format \
                   -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast \
                   -Wno-pointer-sign -Wno-macro-redefined \
                   -Wno-parentheses-equality -Wno-unused-value \
                   -Wno-unknown-warning-option" \
          make O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            -j"$(nproc)" Image.gz

      - name: Report modversions fingerprint (module_layout CRC)
        continue-on-error: true
        run: |
          OUT=kernel/out
          echo "=== our module_layout CRC ==="
          grep -w "module_layout" "$OUT/Module.symvers" || echo "(not found)"
          echo "=== config of interest ==="
          grep -E "^CONFIG_(MODULE_SIG|MODVERSIONS|KALLSYMS|KPROBES|LIVEPATCH|FTRACE|MODULE_UNLOAD|MODULE_FORCE|JUMP_LABEL|TRACEPOINTS|EVENT_TRACING)" "$OUT/.config" || true
          echo "=== first 15 exported symbols (CRC) ==="
          head -15 "$OUT/Module.symvers" || true
          mkdir -p fp
          cp "$OUT/Module.symvers" fp/ 2>/dev/null || true
          cp "$OUT/.config" fp/config-built.txt 2>/dev/null || true

      - name: Verify and enforce vermagic (+ suffix, matches F.28 stock)
        run: |
          cd kernel
          ls -l out/arch/arm64/boot/Image.gz
          python3 - <<'PY'
          import gzip
          TARGET = '4.19.191+ SMP preempt mod_unload modversions aarch64'
          NOPLUS = '4.19.191 SMP preempt mod_unload modversions aarch64'
          p = 'out/arch/arm64/boot/Image.gz'
          raw = bytearray(gzip.decompress(open(p, 'rb').read()))
          got = None
          for cand in (TARGET, NOPLUS):
              i = raw.find(cand.encode())
              if i >= 0:
                  got = (cand, i)
                  break
          print('image size      :', len(raw))
          print('vermagic found  :', got)
          if got is None:
              raise SystemExit('vermagic string not found in Image - build is suspect')
          val, off = got
          if val == TARGET:
              print('[=] vermagic already correct (tree was dirty -> + present)')
          else:
              # 用 + 版本覆盖，尾部原为 0x00 填充，空间足够
              new = TARGET.encode()
              raw[off:off + len(new)] = new
              open(p, 'wb').write(gzip.compress(bytes(raw), 9, mtime=0))
              print('[+] vermagic patched:', NOPLUS, '->', TARGET)
              # 复验
              chk = gzip.decompress(open(p, 'rb').read())
              assert TARGET.encode() in chk, 'patch verification failed'
              print('[+] re-verified OK')
          PY

      - name: Repack boot.img (F.28 stock as base)
        run: |
          mkdir -p out
          python3 scripts/repack.py \
            boot/f28_boot_stock.img \
            kernel/out/arch/arm64/boot/Image.gz \
            out/boot-rmx3350-f28-ksu.img \
            --permissive
          ls -l out/
          file out/boot-rmx3350-f28-ksu.img || true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp kernel/out/arch/arm64/boot/Image.gz artifacts/Image.gz
          cp out/boot-rmx3350-f28-ksu.img artifacts/
          cp boot/f28_boot_stock.img artifacts/boot-rmx3350-f28-stock-rollback.img
          ls -l artifacts/
          md5sum artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rmx3350-f28-ksu
          path: |
            artifacts/
            fp/
          retention-days: 30
