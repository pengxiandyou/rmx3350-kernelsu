name: Build RMX3350 KernelSU Kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone Realme AndroidT kernel source (4.19.191)
        run: |
          git clone --depth 1 \
            https://github.com/realme-kernel-opensource/realme_X7max_GTneo_GTneo2T-AndroidT-kernel-source.git \
            kernel
          echo "--- kernel version ---"
          head -6 kernel/Makefile

      - name: Clone Realme AndroidT vendor source
        run: |
          git clone --depth 1 \
            https://github.com/realme-kernel-opensource/realme_X7max_GTneo_GTneo2T-AndroidT-vendor-source.git \
            vendor_repo
          mv vendor_repo/vendor ./vendor
          rm -rf vendor_repo
          # 内核构建脚本按 $(srctree)/../vendor 与 $(srctree)/../kernel-4.19 找路径
          ln -sfn "$PWD/kernel" "$PWD/kernel-4.19"
          ln -sfn "$PWD/kernel/drivers" "$PWD/drivers"
          ls -d vendor kernel-4.19 drivers

      - name: Repair dangling vendor symlinks
        run: |
          set +e
          # OPPO 源码树里 drivers/base/kernelFwUpdate 是指向 vnd/vendor/... 的软链，
          # 该布局只在 OPPO 内部构建机存在，CI 里必然断链 -> olddefconfig 报
          # drivers/base/Kconfig:155: can't open file "drivers/base/kernelFwUpdate/Kconfig"
          # 解法一：按它们期望的相对路径铺一份（../../../../vnd/vendor = 工作区的父目录）
          mkdir -p "$GITHUB_WORKSPACE/../vnd"
          ln -sfn "$GITHUB_WORKSPACE/vendor" "$GITHUB_WORKSPACE/../vnd/vendor"
          # 解法二（兜底）：直接把实体文件复制进内核树，彻底不依赖软链解析
          rm -rf kernel/drivers/base/kernelFwUpdate
          cp -r vendor/oplus/kernel/touchpanel/kernelFwUpdate kernel/drivers/base/kernelFwUpdate
          echo "--- kernelFwUpdate 内容 ---"
          ls -l kernel/drivers/base/kernelFwUpdate
          # 顺手列出全部断链，便于下一轮排查
          echo "--- 扫描内核树断链软链 ---"
          cd kernel
          broken=0
          while IFS= read -r l; do
            if [ ! -e "$l" ]; then
              echo "BROKEN: $l -> $(readlink "$l")"
              broken=$((broken+1))
            fi
          done < <(find . -type l 2>/dev/null)
          echo "broken symlink count: $broken"

      - name: Clone KernelSU-Next into drivers/kernelsu
        run: |
          # 注意：KernelSU-Next 的仓库根不是内核模块根，真正的 Kconfig/Makefile/Kbuild
          # 在 kernel/ 子目录里。直接 clone 到 drivers/kernelsu 会导致
          #   drivers/Kconfig:241: can't open file "drivers/kernelsu/Kconfig"
          git clone --depth 1 --branch v3.4.2 \
            https://github.com/KernelSU-Next/KernelSU-Next.git ksu_src
          mkdir -p kernel/drivers/kernelsu
          cp -r ksu_src/kernel/. kernel/drivers/kernelsu/
          # uapi/ 也在仓库根，但 kernel/policy/allowlist.h 用 #include "uapi/app_profile.h"，
          # 经 Kbuild 的 -I$(KSU_KERNEL_DIR) 解析为 drivers/kernelsu/uapi/app_profile.h，
          # 所以必须一并拷进来，否则：
          #   policy/allowlist.h:6:10: fatal error: 'uapi/app_profile.h' file not found
          cp -r ksu_src/uapi kernel/drivers/kernelsu/uapi
          echo "--- drivers/kernelsu 内容 ---"
          ls -la kernel/drivers/kernelsu | head -25
          echo "--- uapi ---"
          ls -l kernel/drivers/kernelsu/uapi
          for f in Kconfig Makefile Kbuild uapi/app_profile.h uapi/supercall.h; do
            test -e "kernel/drivers/kernelsu/$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Inject KSU into Kconfig / Makefile
        run: |
          python3 scripts/inject_ksu.py kernel
          echo "--- Kconfig tail ---"
          tail -5 kernel/drivers/Kconfig
          echo "--- Makefile tail ---"
          tail -4 kernel/drivers/Makefile

      - name: Add Linux 4.19 compatibility shims
        run: |
          # KernelSU-Next 默认面向 5.10+，用到了一些 4.19 还没有的头文件。
          # linux/pgtable.h 是 Linux 5.8 才从 asm/pgtable.h 拆出来的：
          #   drivers/kernelsu/feature/sucompat.c:8:10: fatal error:
          #   'linux/pgtable.h' file not found
          # 这里只加转发头，不改 KSU 源码。
          cat > kernel/include/linux/pgtable.h <<'EOF'
          #ifndef _LINUX_PGTABLE_H_COMPAT_419
          #define _LINUX_PGTABLE_H_COMPAT_419
          #include <asm/pgtable.h>
          #endif
          EOF
          echo "--- shim: include/linux/pgtable.h ---"
          cat kernel/include/linux/pgtable.h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev pahole zip unzip \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            python3 git make

      - name: Download AOSP Clang r416183b
        run: |
          mkdir -p "$HOME/clang"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/clang-r416183b.tar.gz"
          curl -fsSL --retry 3 --connect-timeout 40 "$URL" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          "$HOME/clang/bin/clang" --version

      - name: Merge config (stock F.28 + minimal KSU overlay)
        run: |
          cd kernel
          mkdir -p out
          ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out \
            ../configs/stock_f28.config \
            ../configs/custom_rmx3350.config
          # 确认关键项
          grep -E "^CONFIG_KSU=|^CONFIG_KSU_MANUAL_HOOK=|MODULE_SIG" out/.config | sort

      - name: Build Image.gz
        run: |
          cd kernel
          export PATH="$HOME/clang/bin:$PATH"
          # MTK/OPPO 的 sched_assist 等代码用 void foo() 旧式定义，在内核 -Werror 下直接失败：
          #   sched_assist_slide_v1.c:129: error: this old-style function definition
          #   is not preceded by a prototype [-Werror,-Wstrict-prototypes]
          #
          # 注意：必须用 -Wno-xxx（不认识的 warning 会被静默忽略），
          # 绝不能用 -Werror=xxx（不认识的选项会触发 -Wunknown-warning-option 并直接失败，
          # 例如 clang 12 不认识 GCC 的 -Werror=unused-but-set-variable）。
          KCFLAGS="-Wno-strict-prototypes -Wno-unused-but-set-variable \
                   -Wno-address-of-packed-member -Wno-incompatible-pointer-types \
                   -Wno-implicit-function-declaration -Wno-format \
                   -Wno-unknown-warning-option" \
          make O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            olddefconfig
          KCFLAGS="-Wno-strict-prototypes -Wno-unused-but-set-variable \
                   -Wno-address-of-packed-member -Wno-incompatible-pointer-types \
                   -Wno-implicit-function-declaration -Wno-format \
                   -Wno-unknown-warning-option" \
          make O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            -j"$(nproc)" Image.gz

      - name: Verify and enforce vermagic (+ suffix, matches F.28 stock)
        run: |
          cd kernel
          ls -l out/arch/arm64/boot/Image.gz
          python3 - <<'PY'
          import gzip
          TARGET = '4.19.191+ SMP preempt mod_unload modversions aarch64'
          NOPLUS = '4.19.191 SMP preempt mod_unload modversions aarch64'
          p = 'out/arch/arm64/boot/Image.gz'
          raw = bytearray(gzip.decompress(open(p, 'rb').read()))
          got = None
          for cand in (TARGET, NOPLUS):
              i = raw.find(cand.encode())
              if i >= 0:
                  got = (cand, i)
                  break
          print('image size      :', len(raw))
          print('vermagic found  :', got)
          if got is None:
              raise SystemExit('vermagic string not found in Image - build is suspect')
          val, off = got
          if val == TARGET:
              print('[=] vermagic already correct (tree was dirty -> + present)')
          else:
              # 用 + 版本覆盖，尾部原为 0x00 填充，空间足够
              new = TARGET.encode()
              raw[off:off + len(new)] = new
              open(p, 'wb').write(gzip.compress(bytes(raw), 9, mtime=0))
              print('[+] vermagic patched:', NOPLUS, '->', TARGET)
              # 复验
              chk = gzip.decompress(open(p, 'rb').read())
              assert TARGET.encode() in chk, 'patch verification failed'
              print('[+] re-verified OK')
          PY

      - name: Repack boot.img (F.28 stock as base)
        run: |
          python3 scripts/repack.py \
            boot/f28_boot_stock.img \
            kernel/out/arch/arm64/boot/Image.gz \
            out/boot-rmx3350-f28-ksu.img \
            --permissive

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp kernel/out/arch/arm64/boot/Image.gz artifacts/Image.gz
          cp out/boot-rmx3350-f28-ksu.img artifacts/
          cp boot/f28_boot_stock.img artifacts/boot-rmx3350-f28-stock-rollback.img
          ls -l artifacts/
          md5sum artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rmx3350-f28-ksu
          path: artifacts/
          retention-days: 30
